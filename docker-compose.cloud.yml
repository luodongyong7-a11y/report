# Single-VPS full stack. Build images first (see scripts/build-cloud-images.ps1 / .sh),
# then: docker compose -f docker-compose.cloud.yml --env-file .env.cloud up -d
services:
  report-pdf:
    image: ${REPORT_PDF_IMAGE:-report-pdf:standalone}
    container_name: report-tool-pdf
    restart: unless-stopped
    environment:
      PORT: 7321
      HOST: 0.0.0.0
      TZ: ${TZ:-Asia/Bangkok}
      REPORT_WORKERS: ${REPORT_WORKERS:-2}
      REPORT_WORKER_HEAP_MB: ${REPORT_WORKER_HEAP_MB:-2048}
      REPORT_MAX_DATA_ROWS: ${REPORT_MAX_DATA_ROWS:-200000}
      REPORT_FONT_TIMES: /usr/share/fonts/win/times.ttf
      REPORT_FONT_TIMES_BOLD: /usr/share/fonts/win/timesbd.ttf
      REPORT_FONT_TIMES_ITALIC: /usr/share/fonts/win/timesi.ttf
      REPORT_FONT_TIMES_BOLDITALIC: /usr/share/fonts/win/timesbi.ttf
      REPORT_FONT_SIMSUN: /usr/share/fonts/win/simsun.ttc
      REPORT_FONT_SIMHEI: /usr/share/fonts/win/simhei.ttf
      REPORT_FONT_SYMBOL: /usr/share/fonts/win/seguisym.ttf
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7321/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  report-tool-api:
    image: ${REPORT_TOOL_API_IMAGE:-report-tool-api:standalone}
    container_name: report-tool-api
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Bangkok}
      REPORT_PDF_SIDECAR_URL: http://report-pdf:7321/render
      REPORT_TOOL_DATA_DIR: /data
      REPORT_TOOL_ADMIN_USERNAME: ${REPORT_TOOL_ADMIN_USERNAME:-admin}
      REPORT_TOOL_ADMIN_PASSWORD: ${REPORT_TOOL_ADMIN_PASSWORD:?set admin password}
      REPORT_API_ALLOWED_URL_PREFIXES: ${REPORT_API_ALLOWED_URL_PREFIXES:-*}
      REPORT_API_INTERNAL_BASE_URL: ${REPORT_API_INTERNAL_BASE_URL:-}
      REPORT_LICENSE_KEY: ${REPORT_LICENSE_KEY:-}
      REPORT_LICENSE_FILE: ${REPORT_LICENSE_FILE:-/data/license.key}
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/tool;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    volumes:
      - report-tool-data:/data
    # Only expose via web nginx on the host; keep API internal unless debugging
    expose:
      - "8088"
    depends_on:
      report-pdf:
        condition: service_healthy

  report-tool-web:
    image: ${REPORT_TOOL_WEB_IMAGE:-report-tool-web:standalone}
    container_name: report-tool-web
    restart: unless-stopped
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
    depends_on:
      - report-tool-api

volumes:
  report-tool-data:

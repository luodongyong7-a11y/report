server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /auth/ {
        proxy_pass http://report-tool-api:8088;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /report/ {
        proxy_pass http://report-tool-api:8088;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://report-tool-api:8088;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
